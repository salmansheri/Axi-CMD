receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /ready
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
    timeout: 2s
    sending_queue:
      queue_size: 128
    retry_on_failure:
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    timeout: 2s
    sending_queue:
      queue_size: 128
    retry_on_failure:
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
    timeout: 2s
    sending_queue:
      queue_size: 128
    retry_on_failure:
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/logs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/traces]
